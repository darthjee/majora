# NPC character endpoint rules. No owner concept (NPCs have no PC-owning-player leniency);
# `treasure_exchange` is narrower (restricted, staff only, no player leniency) than its PC
# counterpart. `player_edit` backs the narrow player-facing NPC update
# (NpcPlayerEditPermission); `create` backs creating a brand-new player-facing NPC
# (NpcPlayerCreatePermission), checked against the game only (no existing NPC yet).
restricted:
  edit: []
  photo_delete:
    - staff
  treasure_exchange:
    - staff
regular:
  photo_upload:
    - staff
    - player
  player_edit:
    - staff
    - player
  create:
    - staff
    - player
