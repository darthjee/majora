# PC character-possession endpoint rules (issue #1076, #1099). `create` (restricted) gates
# the `/acquire/all.json`/`/remove/all.json` variants (staff/owner only); `create` (regular)
# gates the plain `/acquire.json`/`/remove.json` endpoints (staff/player), mirroring
# game_pc_document/endpoints.yml's own restricted/regular split. `create_update` (regular)
# gates create-from-scratch (`possessions.json` POST), borrowed unchanged from game_pc_item's
# player-facing creation tier. No `photo_upload` action — the photo lives only on
# GamePossession, never overridden at the character level.
restricted:
  create:
    - staff
    - owner
regular:
  create:
    - staff
    - player
  create_update:
    - staff
    - player
    - owner
