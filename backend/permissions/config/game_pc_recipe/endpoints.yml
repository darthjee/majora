# PC character-recipe endpoint rules (issue #1459). `create` (regular) gates the plain
# `/available.json`, `/acquire.json` and `/remove.json` endpoints (staff/player). No
# `restricted` block: the `/all` variants are gated by GameEdit (`available/all`,
# `acquire/all`) and CharacterEdit (`remove/all`) instead.
# Keep `regular.create` identical to game_pc_recipe/ui.yml's `exchange`.
regular:
  create:
    - staff
    - player
