version: '3.8'

# This file publishes no host ports, so tests and validation runs never bind
# host ports (#1724). Host-port mappings live in docker-compose.ports.yml and
# are opt-in:
#   docker-compose -f docker-compose.yml -f docker-compose.ports.yml up <service...>
# (or `make dev-up`).

services:
  majora_mysql:
    image: mysql:9.3.0
    container_name: majora_mysql
    env_file: .env
    environment:
      MYSQL_DATABASE: majora
      MYSQL_USER: majora
      MYSQL_PASSWORD: majora
      MYSQL_ROOT_PASSWORD: majora
    volumes:
      - ./docker_volumes/mysql_data:/var/lib/mysql

  #################### Base  ####################

  base: &base
    image: darthjee/majora
    volumes:
      - ./backend:/home/app/app
    links:
      - majora_mysql:mysql
    env_file: .env

  base_build:
    <<: *base
    build:
      context: .
      dockerfile: dockerfiles/majora/Dockerfile
    command: echo done

  base_prod: &base_prod
    image: darthjee/production_majora
    links:
      - majora_mysql:mysql
    env_file: .env.prod

  base_prod_build:
    <<: *base_prod
    build:
      context: .
      dockerfile: dockerfiles/production_majora/Dockerfile
    command: echo done

  #################### DEV CONTAINERS ####################
  
  majora_app:
    <<: *base
    container_name: majora_app
    depends_on:
      - base_build
      - majora_mysql
      - majora_phpmyadmin
    environment:
      - MAJORA_MYSQL_PORT=3306

  majora_tests:
    <<: *base
    container_name: majora_tests
    depends_on:
      - base_build

  majora_prod_app:
    <<: *base_prod
    container_name: majora_prod_app
    depends_on:
      - base_prod_build
      - majora_mysql
    environment:
      - MAJORA_MYSQL_PORT=3306
      - STAGE=production

  majora_fe:
    container_name: majora_fe
    build:
      context: .
      dockerfile: dockerfiles/vite_majora/Dockerfile
    volumes:
      - ./frontend:/home/node/app
      - ./docker_volumes/node_modules:/home/node/app/node_modules
      - ./docker_volumes/static:/home/node/app/dist
    env_file: .env

  majora_proxy:
    image: darthjee/tent:1.0.2
    container_name: majora_proxy
    env_file: .env
    volumes:
      - ./docker_volumes/static/:/var/www/html/static/
      - ./proxy/dev_configuration:/var/www/html/configuration/
      - ./docker_volumes/proxy_cache:/var/www/html/cache/
      - ./docker_volumes/photos:/var/www/html/photos
      - ./docker_volumes/files:/var/www/html/files
      - ./docker_volumes/domain:/var/www/html/domain
      - ./proxy/extension:/var/www/html/extension
    links:
      - majora_app:backend
      - majora_fe:frontend
    depends_on:
      - majora_app
      - majora_fe

  proxy_tests:
    image: darthjee/tent-test:1.0.2
    volumes:
      - ./proxy/extension:/var/www/html/extension
      - ./proxy:/var/www/html/proxy
    command: vendor/bin/phpunit --bootstrap /var/www/html/extension/tests/bootstrap.php /var/www/html/extension/tests

  majora_navi:
    image: darthjee/navi-hey:1.11.1
    volumes:
      - ./navi/:/home/node/app
    command: navi-hey --config navi_config.yaml
    environment:
      - MAJORA_PRODUCTION_URL=$MAJORA_PRODUCTION_URL
      - STATISTICS_SKIP_SECRET=$STATISTICS_SKIP_SECRET
      - NAVI_PORT=3000
      - NAVI_NAMEPACE=$NAVI_NAMEPACE

  crawler_navi_web:
    build:
      context: .
      dockerfile: dockerfiles/navi_hey_loot_enqueue/Dockerfile
    environment:
      - MAJORA_API_TOKEN=$MAJORA_API_TOKEN
      - MAJORA_API_BASE_URL=$MAJORA_API_BASE_URL
      - LOOTSTUDIOS_SESSION_COOKIE=$LOOTSTUDIOS_SESSION_COOKIE
      - NAVI_API_TOKEN=$NAVI_API_TOKEN

  markdownlint:
    container_name: majora_markdownlint
    build:
      context: .
      dockerfile: dockerfiles/markdownlint/Dockerfile
    volumes:
      - .:/home/node/app
      - ./docker_volumes/markdownlint_node_modules:/home/node/app/node_modules
    command: sh -c "yarn install && yarn lint_md"

  majora_client:
    image: darthjee/node:0.2.1
    container_name: majora_client
    working_dir: /home/node/app
    volumes:
      - ./client:/home/node/app
      - ./docker_volumes/client_node_modules:/home/node/app/node_modules
    environment:
      - MAJORA_URL=${MAJORA_URL:-http://majora_proxy}
      - MAJORA_TOKEN=$MAJORA_TOKEN
      - MAJORA_GAME=$MAJORA_GAME

  majora_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: majora_phpmyadmin
    depends_on: [majora_mysql]
    links:
      - majora_mysql:mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: majora
      MYSQL_PASSWORD: majora

