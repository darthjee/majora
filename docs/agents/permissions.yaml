# Docs-only quick reference. Not consumed by any code path — the
# real source of truth is backend/games/permissions/config/ and
# backend/games/permissions/roles.py. See docs/agents/access-control/
# for the authoritative, per-endpoint rules.
admin:
  access: everything
dm:
  access: everything inside a game they are DM of
owner:
  access: everything inside a PC they own
player:
  access: regular mutation endpoints inside the game they are a player of
staff:
  access: >-
    staff-only endpoints (staff-or-superuser; dm does not qualify), plus a
    short, explicitly-documented list of game-scoped carve-outs (PC regular
    edit, character photo upload, character treasure exchange, game session
    edit, global treasure edit) — not blanket parity with the player role
    across every game; see access-control/common-rules.md and
    access-control/user-roles.md
other_users:
  access: none, except mutations on their own account
account_data:
  access: restricted to the user, unless staff (dm has no account-data access)
