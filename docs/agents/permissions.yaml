# Docs-only quick reference. Not consumed by any code path — the
# real source of truth is backend/games/permissions/config/ and
# backend/games/permissions/roles.py. See docs/agents/access-control/
# for the authoritative, per-endpoint rules.
#
# Schema: each role is a list of entries shaped
#   { scope, read: {regular, restricted}, mutation: {regular, restricted}, note? }
# - scope: the resource scope the row applies to (any, game, owned_pc,
#   staff, own_account, other_account).
# - regular: the plain/public route for that scope (see
#   access-control/principles.md's "Partial vs full access pattern").
# - restricted: the full/private route for the same scope.
# - note: free-text caveat, used whenever a boolean pair alone would
#   overstate or understate the real per-endpoint rule.
admin:
  - scope: any
    read: { regular: true, restricted: true }
    mutation: { regular: true, restricted: true }

dm:
  - scope: game
    read: { regular: true, restricted: true }
    mutation: { regular: true, restricted: true }
    note: only for the game(s) they are DM of

owner:
  - scope: owned_pc
    read: { regular: true, restricted: true }
    mutation: { regular: true, restricted: true }
    note: only for the PC they own

player:
  - scope: game
    read: { regular: true, restricted: false }
    mutation: { regular: true, restricted: false }
    note: only for the game(s) they are a player of

staff:
  - scope: staff
    read: { regular: true, restricted: true }
    mutation: { regular: true, restricted: true }
    note: staff-or-superuser only; dm does not qualify for this scope
  - scope: game
    read: { regular: true, restricted: false }
    mutation: { regular: false, restricted: false }
    note: >-
      not blanket player-parity — only a short, explicitly-documented list
      of per-resource carve-outs (PC regular edit, character photo upload,
      character treasure exchange, game session edit, global treasure
      edit); see access-control/common-rules.md

other_users:
  - scope: game
    read: { regular: true, restricted: false }
    mutation: { regular: false, restricted: false }
    note: same as any anonymous/unrelated visitor — no player/dm/owner role held
  - scope: own_account
    read: { regular: true, restricted: true }
    mutation: { regular: true, restricted: true }
  - scope: other_account
    read: { regular: false, restricted: false }
    mutation: { regular: false, restricted: false }

account_data:
  - scope: own_account
    read: { regular: true, restricted: true }
    mutation: { regular: true, restricted: true }
  - scope: other_account
    read: { regular: false, restricted: false }
    mutation: { regular: false, restricted: false }
    note: >-
      staff/admin are the only exception (see the staff/admin entries
      above) — dm has no account-data access
