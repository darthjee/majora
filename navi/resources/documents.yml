namespace: $NAVI_NAMEPACE
resources:
  game_documents:
    - url: /games/{:slug}/documents.json
      status: 200
      paginated_actions:
        - resource: paginated_game_documents
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_documents:
    - url: /games/{:slug}/documents.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: game_document_details
          parameters:
            slug: parameters.slug
            id: parsedBody.id

  game_document_details:
    - url: /games/{:slug}/documents/{:id}.json
      status: 200
      actions:
        - resource: game_document_files
          parameters:
            slug: parameters.slug
            id: parameters.id
        - resource: game_document_photos
          parameters:
            slug: parameters.slug
            id: parameters.id
        - resource: game_document_pages
          parameters:
            slug: parameters.slug
            id: parameters.id
        - resource: short_game_document_files
          parameters:
            slug: parameters.slug
            id: parameters.id
        - resource: short_game_document_photos
          parameters:
            slug: parameters.slug
            id: parameters.id

  game_document_files:
    - url: /games/{:slug}/documents/{:id}/files.json
      status: 200

  game_document_photos:
    - url: /games/{:slug}/documents/{:id}/photos.json
      status: 200

  # game_document_pages/paginated_game_document_pages only warm the public
  # pages.json endpoint. The restricted pages/all.json variant (dm/admin only,
  # X-Skip-Cache: true) is intentionally never warmed here — same convention
  # already followed (but previously undocumented) for documents/all.json,
  # documents/<id>/full.json, files/all.json and photos/all.json: their
  # X-Skip-Cache header makes Tent bypass the cache for them at request time
  # regardless of whether Navi warmed them.
  game_document_pages:
    - url: /games/{:slug}/documents/{:id}/pages.json?per_page=1
      status: 200
      paginated_actions:
        - resource: paginated_game_document_pages
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false

  paginated_game_document_pages:
    - url: /games/{:slug}/documents/{:id}/pages.json?page={:page}&per_page=1
      status: 200

  short_game_document_files:
    - url: /games/{:slug}/documents/{:id}/files.json?per_page=17
      status: 200

  short_game_document_photos:
    - url: /games/{:slug}/documents/{:id}/photos.json?per_page=17
      status: 200
