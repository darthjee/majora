namespace: $NAVI_NAMEPACE
resources:
  treasures:
    - url: /treasures.json
      status: 200
      paginated_actions:
        - resource: paginated_treasures
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_treasures:
    - url: /treasures.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: treasure_detail
          parameters:
            id: parsedBody.id

  treasure_detail:
    - url: /treasures/{:id}.json
      status: 200
