namespace: $NAVI_NAMEPACE
resources:
  games:
    - url: /games.json
      status: 200
      paginated_actions:
        - resource: paginated_games
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_games:
    - url: /games.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: game_detail
          parameters:
            slug: parsedBody.game_slug
        - resource: game_pcs
          parameters:
            slug: parsedBody.game_slug
        - resource: game_npcs
          parameters:
            slug: parsedBody.game_slug
        - resource: game_treasures
          parameters:
            slug: parsedBody.game_slug
        - resource: game_items
          parameters:
            slug: parsedBody.game_slug
        - resource: game_factions
          parameters:
            slug: parsedBody.game_slug
        - resource: game_possessions
          parameters:
            slug: parsedBody.game_slug
        - resource: game_photos
          parameters:
            slug: parsedBody.game_slug
        - resource: game_documents
          parameters:
            slug: parsedBody.game_slug
        - resource: game_sessions
          parameters:
            slug: parsedBody.game_slug

  game_detail:
    - url: /games/{:slug}.json
      status: 200
      actions:
        - resource: short_game_pcs
          parameters:
            slug: parsedBody.game_slug
        - resource: short_game_npcs
          parameters:
            slug: parsedBody.game_slug

  game_photos:
    - url: /games/{:slug}/photos.json
      status: 200
      paginated_actions:
        - resource: paginated_game_photos
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_photos:
    - url: /games/{:slug}/photos.json?page={:page}&per_page={:per_page}
      status: 200
