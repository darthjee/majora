resources:
  games:
    - url: /games.json
      status: 200
      paginated_actions:
        - resource: paginated_games
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_games:
    - url: /games.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: game_detail
          parameters:
            slug: parsedBody.game_slug
        - resource: game_pcs
          parameters:
            slug: parsedBody.game_slug
        - resource: game_npcs
          parameters:
            slug: parsedBody.game_slug
        - resource: game_treasures
          parameters:
            slug: parsedBody.game_slug
        - resource: game_items
          parameters:
            slug: parsedBody.game_slug
        - resource: game_documents
          parameters:
            slug: parsedBody.game_slug
        - resource: game_sessions
          parameters:
            slug: parsedBody.game_slug

  game_detail:
    - url: /games/{:slug}.json
      status: 200
      actions:
        - resource: short_game_pcs
          parameters:
            slug: parsedBody.game_slug
        - resource: short_game_npcs
          parameters:
            slug: parsedBody.game_slug

  short_game_pcs:
    - url: /games/{:slug}/pcs.json?per_page=5
      status: 200

  short_game_npcs:
    - url: /games/{:slug}/npcs.json?per_page=5
      status: 200

  game_pcs:
    - url: /games/{:slug}/pcs.json
      status: 200
      paginated_actions:
        - resource: paginated_game_pcs
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_pcs:
    - url: /games/{:slug}/pcs.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: pc
          parameters:
            id: parsedBody.id
            slug: parsedBody.game_slug

  game_npcs:
    - url: /games/{:slug}/npcs.json
      status: 200
      paginated_actions:
        - resource: paginated_game_npcs
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_npcs:
    - url: /games/{:slug}/npcs.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: npc
          parameters:
            id: parsedBody.id
            slug: parsedBody.game_slug

  game_treasures:
    - url: /games/{:slug}/treasures.json
      status: 200
      paginated_actions:
        - resource: paginated_game_treasures
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_treasures:
    - url: /games/{:slug}/treasures.json?page={:page}&per_page={:per_page}
      status: 200

  game_items:
    - url: /games/{:slug}/items.json
      status: 200
      paginated_actions:
        - resource: paginated_game_items
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_items:
    - url: /games/{:slug}/items.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: game_item_detail
          parameters:
            slug: parameters.slug
            id: parsedBody.id

  game_item_detail:
    - url: /games/{:slug}/items/{:id}.json
      status: 200

  game_documents:
    - url: /games/{:slug}/documents.json
      status: 200
      paginated_actions:
        - resource: paginated_game_documents
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_documents:
    - url: /games/{:slug}/documents.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: game_document_details
          parameters:
            slug: parameters.slug
            id: parsedBody.id

  game_document_details:
    - url: /games/{:slug}/documents/{:id}.json
      status: 200
      actions:
        - resource: game_document_files
          parameters:
            slug: parameters.slug
            id: parameters.id
        - resource: game_document_photos
          parameters:
            slug: parameters.slug
            id: parameters.id
        - resource: short_game_document_files
          parameters:
            slug: parameters.slug
            id: parameters.id
        - resource: short_game_document_photos
          parameters:
            slug: parameters.slug
            id: parameters.id

  game_document_files:
    - url: /games/{:slug}/documents/{:id}/files.json
      status: 200

  game_document_photos:
    - url: /games/{:slug}/documents/{:id}/photos.json
      status: 200

  short_game_document_files:
    - url: /games/{:slug}/documents/{:id}/files.json?per_page=17
      status: 200

  short_game_document_photos:
    - url: /games/{:slug}/documents/{:id}/photos.json?per_page=17
      status: 200

  game_sessions:
    - url: /games/{:slug}/sessions/past.json
      status: 200
      paginated_actions:
        - resource: paginated_game_sessions_past
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']
    - url: /games/{:slug}/sessions/future.json
      status: 200
      paginated_actions:
        - resource: paginated_game_sessions_future
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']
    - url: /games/{:slug}/sessions/unscheduled.json
      status: 200
      paginated_actions:
        - resource: paginated_game_sessions_unscheduled
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_sessions_past:
    - url: /games/{:slug}/sessions/past.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: session
          parameters:
            id: parsedBody.id
            slug: parsedBody.game_slug

  paginated_game_sessions_future:
    - url: /games/{:slug}/sessions/future.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: session
          parameters:
            id: parsedBody.id
            slug: parsedBody.game_slug

  paginated_game_sessions_unscheduled:
    - url: /games/{:slug}/sessions/unscheduled.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: session
          parameters:
            id: parsedBody.id
            slug: parsedBody.game_slug

  session:
    - url: /games/{:slug}/sessions/{:id}.json
      status: 200
