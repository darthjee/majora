namespace: $NAVI_NAMEPACE
resources:
  npc:
    - url: /games/{:slug}/npcs/{:id}.json
      status: 200
      actions:
        - resource: npc_photos
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_npc_photos
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: npc_treasures
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_npc_treasures
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: npc_items
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_npc_items
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: npc_documents
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_npc_documents
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: npc_possessions
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_npc_possessions
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id

  npc_photos:
    - url: /games/{:slug}/npcs/{:id}/photos.json
      status: 200
      paginated_actions:
        - resource: paginated_npc_photos
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_npc_photos:
    - url: /games/{:slug}/npcs/{:id}/photos.json?page={:page}&per_page={:per_page}
      status: 200

  short_npc_photos:
    - url: /games/{:slug}/npcs/{:id}/photos.json?per_page=11
      status: 200

  npc_treasures:
    - url: /games/{:slug}/npcs/{:id}/treasures.json
      status: 200
      paginated_actions:
        - resource: paginated_npc_treasures
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_npc_treasures:
    - url: /games/{:slug}/npcs/{:id}/treasures.json?page={:page}&per_page={:per_page}
      status: 200

  short_npc_treasures:
    - url: /games/{:slug}/npcs/{:id}/treasures.json?per_page=5
      status: 200

  npc_items:
    - url: /games/{:slug}/npcs/{:id}/items.json
      status: 200
      paginated_actions:
        - resource: paginated_npc_items
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_npc_items:
    - url: /games/{:slug}/npcs/{:id}/items.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: npc_item_detail
          parameters:
            slug: parameters.slug
            id: parameters.id
            item_id: parsedBody.id

  npc_item_detail:
    - url: /games/{:slug}/npcs/{:id}/items/{:item_id}.json
      status: 200

  short_npc_items:
    - url: /games/{:slug}/npcs/{:id}/items.json?per_page=5
      status: 200

  npc_documents:
    - url: /games/{:slug}/npcs/{:id}/documents.json
      status: 200
      paginated_actions:
        - resource: paginated_npc_documents
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_npc_documents:
    - url: /games/{:slug}/npcs/{:id}/documents.json?page={:page}&per_page={:per_page}
      status: 200

  short_npc_documents:
    - url: /games/{:slug}/npcs/{:id}/documents.json?per_page=5
      status: 200

  npc_possessions:
    - url: /games/{:slug}/npcs/{:id}/possessions.json
      status: 200
      paginated_actions:
        - resource: paginated_npc_possessions
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_npc_possessions:
    - url: /games/{:slug}/npcs/{:id}/possessions.json?page={:page}&per_page={:per_page}
      status: 200

  short_npc_possessions:
    - url: /games/{:slug}/npcs/{:id}/possessions.json?per_page=5
      status: 200

  short_game_npcs:
    - url: /games/{:slug}/npcs.json?per_page=5
      status: 200

  game_npcs:
    - url: /games/{:slug}/npcs.json
      status: 200
      paginated_actions:
        - resource: paginated_game_npcs
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_game_npcs:
    - url: /games/{:slug}/npcs.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: npc
          parameters:
            id: parsedBody.id
            slug: parsedBody.game_slug
