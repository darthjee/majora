  npc_document_files:
    - url: /games/{:slug}/npcs/{:id}/documents/{:document_id}/files.json
      status: 200

  npc_document_photos:
    - url: /games/{:slug}/npcs/{:id}/documents/{:document_id}/photos.json
      status: 200

  npc_documents_available:
    - url: /games/{:slug}/npcs/{:id}/documents/available.json
      status: 200

  short_npc_documents:
    - url: /games/{:slug}/npcs/{:id}/documents.json?per_page=5
      status: 200

  npc_factions:
    - url: /games/{:slug}/npcs/{:id}/factions.json
      status: 200
      paginated_actions:
        - resource: paginated_npc_factions
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_npc_factions:
    - url: /games/{:slug}/npcs/{:id}/factions.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: npc_faction_detail
          parameters:
            slug: parameters.slug
            id: parameters.id
            faction_id: parsedBody.id

  npc_faction_detail:
    - url: /games/{:slug}/npcs/{:id}/factions/{:faction_id}.json
      status: 200

  npc_factions_available:
    - url: /games/{:slug}/npcs/{:id}/factions/available.json
      status: 200

  short_npc_factions:
    - url: /games/{:slug}/npcs/{:id}/factions.json?per_page=5
      status: 200

  npc_possessions:
    - url: /games/{:slug}/npcs/{:id}/possessions.json
      status: 200
      paginated_actions:
        - resource: paginated_npc_possessions
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_npc_possessions:
    - url: /games/{:slug}/npcs/{:id}/possessions.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: npc_possession_detail
          parameters:
            slug: parameters.slug
            id: parameters.id
            possession_id: parsedBody.id

  npc_possession_detail:
    - url: /games/{:slug}/npcs/{:id}/possessions/{:possession_id}.json
      status: 200

  npc_possessions_available:
    - url: /games/{:slug}/npcs/{:id}/possessions/available.json
      status: 200

  short_npc_possessions:
    - url: /games/{:slug}/npcs/{:id}/possessions.json?per_page=5
      status: 200

  npc_recipes:
    - url: /games/{:slug}/npcs/{:id}/recipes.json
      status: 200
      paginated_actions:
        - resource: paginated_npc_recipes
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_npc_recipes:
    - url: /games/{:slug}/npcs/{:id}/recipes.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: npc_recipe_detail
          parameters:
