  npc_recipe_detail:
    - url: /games/{:slug}/npcs/{:id}/recipes/{:recipe_id}.json
      status: 200

  short_npc_recipes:
    - url: /games/{:slug}/npcs/{:id}/recipes.json?per_page=5
      status: 200

  npc_treasure_summary:
    - url: /games/{:slug}/treasures/{:treasure_id}/npcs/{:character_id}/summary.json
      status: 200

  npc_document_summary:
    - url: /games/{:slug}/documents/{:document_id}/npcs/{:character_id}/summary.json
      status: 200

  npc_faction_summary:
