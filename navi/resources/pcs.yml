      status: 200
      paginated_actions:
        - resource: paginated_pc_factions
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_pc_factions:
    - url: /games/{:slug}/pcs/{:id}/factions.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: pc_faction_detail
          parameters:
