      status: 200

  pc_documents_available:
    - url: /games/{:slug}/pcs/{:id}/documents/available.json
      status: 200

  short_pc_documents:
    - url: /games/{:slug}/pcs/{:id}/documents.json?per_page=5
      status: 200

  pc_factions:
