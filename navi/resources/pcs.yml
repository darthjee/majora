  pc_treasure_summary:
    - url: /games/{:slug}/treasures/{:treasure_id}/pcs/{:character_id}/summary.json
      status: 200

  pc_document_summary:
    - url: /games/{:slug}/documents/{:document_id}/pcs/{:character_id}/summary.json
      status: 200

  pc_faction_summary:
