        - resource: pc_possession_detail
          parameters:
            slug: parameters.slug
            id: parameters.id
            possession_id: parsedBody.id

  pc_possession_detail:
    - url: /games/{:slug}/pcs/{:id}/possessions/{:possession_id}.json
      status: 200

  pc_possessions_available:
    - url: /games/{:slug}/pcs/{:id}/possessions/available.json
      status: 200

  short_pc_possessions:
    - url: /games/{:slug}/pcs/{:id}/possessions.json?per_page=5
      status: 200

  pc_recipes:
    - url: /games/{:slug}/pcs/{:id}/recipes.json
      status: 200
      paginated_actions:
        - resource: paginated_pc_recipes
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_pc_recipes:
    - url: /games/{:slug}/pcs/{:id}/recipes.json?page={:page}&per_page={:per_page}
      status: 200
