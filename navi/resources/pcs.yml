namespace: $NAVI_NAMEPACE
resources:
  pc:
    - url: /games/{:slug}/pcs/{:id}.json
      status: 200
      actions:
        - resource: pc_photos
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_pc_photos
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: pc_treasures
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_pc_treasures
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: pc_items
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_pc_items
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: pc_documents
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_pc_documents
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: pc_factions
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_pc_factions
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: pc_possessions
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_pc_possessions
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: pc_recipes
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id
        - resource: short_pc_recipes
          parameters:
            slug: parsedBody.game_slug
            id: parsedBody.id

  pc_photos:
    - url: /games/{:slug}/pcs/{:id}/photos.json
      status: 200
      paginated_actions:
        - resource: paginated_pc_photos
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_pc_photos:
    - url: /games/{:slug}/pcs/{:id}/photos.json?page={:page}&per_page={:per_page}
      status: 200

  short_pc_photos:
    - url: /games/{:slug}/pcs/{:id}/photos.json?per_page=11
      status: 200

  pc_treasures:
    - url: /games/{:slug}/pcs/{:id}/treasures.json
      status: 200
      paginated_actions:
        - resource: paginated_pc_treasures
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_pc_treasures:
    - url: /games/{:slug}/pcs/{:id}/treasures.json?page={:page}&per_page={:per_page}
      status: 200

  short_pc_treasures:
    - url: /games/{:slug}/pcs/{:id}/treasures.json?per_page=5
      status: 200

  pc_items:
    - url: /games/{:slug}/pcs/{:id}/items.json
      status: 200
      paginated_actions:
        - resource: paginated_pc_items
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_pc_items:
    - url: /games/{:slug}/pcs/{:id}/items.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: pc_item_detail
          parameters:
            slug: parameters.slug
            id: parameters.id
            item_id: parsedBody.id

  pc_item_detail:
    - url: /games/{:slug}/pcs/{:id}/items/{:item_id}.json
      status: 200

  pc_items_available:
    - url: /games/{:slug}/pcs/{:id}/items/available.json
      status: 200

  short_pc_items:
    - url: /games/{:slug}/pcs/{:id}/items.json?per_page=5
      status: 200

  pc_documents:
    - url: /games/{:slug}/pcs/{:id}/documents.json
      status: 200
      paginated_actions:
        - resource: paginated_pc_documents
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
            per_page: headers['per_page']

  paginated_pc_documents:
    - url: /games/{:slug}/pcs/{:id}/documents.json?page={:page}&per_page={:per_page}
      status: 200
      actions:
        - resource: pc_document_detail
          parameters:
            slug: parameters.slug
            id: parameters.id
            document_id: parsedBody.id
        - resource: pc_document_files
          parameters:
            slug: parameters.slug
            id: parameters.id
            document_id: parsedBody.id
        - resource: pc_document_photos
          parameters:
            slug: parameters.slug
            id: parameters.id
            document_id: parsedBody.id

  pc_document_detail:
