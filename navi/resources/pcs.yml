            id: parameters.id
            faction_id: parsedBody.id

  pc_faction_detail:
    - url: /games/{:slug}/pcs/{:id}/factions/{:faction_id}.json
      status: 200

  pc_factions_available:
    - url: /games/{:slug}/pcs/{:id}/factions/available.json
      status: 200

  short_pc_factions:
    - url: /games/{:slug}/pcs/{:id}/factions.json?per_page=5
      status: 200

  pc_possessions:
    - url: /games/{:slug}/pcs/{:id}/possessions.json
      status: 200
      paginated_actions:
        - resource: paginated_pc_possessions
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false
          parameters:
